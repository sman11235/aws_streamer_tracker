name: Build and deploy to AWS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.6"

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Lambda ZIPs
        run: python scripts/build_lambda_zips.py
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate application Terraform
        run: |
          terraform -chdir=terraform init -backend=false -lockfile=readonly
          terraform -chdir=terraform validate
      - name: Validate bootstrap Terraform
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=terraform/bootstrap validate

  deploy:
    name: Deploy dev
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    concurrency:
      group: deploy-aws-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project: ${{ vars.PROJECT || 'streamer-stats' }}
      TF_VAR_environment: dev
      TF_VAR_postgres_backup_retention_days: ${{ vars.POSTGRES_BACKUP_RETENTION_DAYS || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment configuration
        run: |
          : "${AWS_ROLE_ARN:?Set AWS_ROLE_ARN in the dev GitHub environment}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET in the dev GitHub environment}"
          : "${TF_STATE_KEY:?Set TF_STATE_KEY in the dev GitHub environment}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Build Lambda ZIPs
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/build_lambda_zips.py
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Initialize shared Terraform state
        run: |
          terraform -chdir=terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION"
      - name: Plan deployment
        run: terraform -chdir=terraform plan -lock-timeout=5m -out=deploy.tfplan
      - name: Apply deployment
        run: terraform -chdir=terraform apply -lock-timeout=5m -auto-approve deploy.tfplan
      - name: Show deployment outputs
        run: terraform -chdir=terraform output
